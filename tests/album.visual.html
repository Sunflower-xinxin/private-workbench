<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>album-visual</title>
<style>
  html,body{margin:0;padding:0;background:#ECECEE;height:100%}
  body{display:flex;align-items:center;justify-content:center}
  iframe{width:393px;height:852px;border:0}
  #banner{position:fixed;left:0;bottom:0;right:0;z-index:999;padding:4px 10px;font:12px/1.4 Consolas,monospace;background:rgba(255,255,255,.94);border-top:1px solid #ddd;pointer-events:none}
</style>
</head>
<body>
<img src="/__wait/9000" alt="" style="display:none">
<iframe id="f" src="../index.html"></iframe>
<div id="banner">loading…</div>
<script>
window.__errs = [];
window.addEventListener('error', e => { window.__errs.push(String(e.message)); report('未捕获异常: ' + (e.message || e.error), false); });
function report(txt, ok) {
  const b = document.getElementById('banner');
  b.textContent = (ok === null ? 'INFO' : (ok ? 'PASS' : 'FAIL')) + ' | ' + txt + (window.__errs.length ? ' | JS错误:' + window.__errs.join(' ; ') : '');
  b.style.color = ok === null ? '#333' : (ok ? '#0a6b2d' : '#b00020');
}
const f = document.getElementById('f');
/* 轮询等待 iframe 内 App 就绪后立即执行（外层 load 由 /__wait 慢图压住） */
const t0 = Date.now();
const poll = setInterval(() => {
  const W = f.contentWindow;
  if (W && W.PWStore && W.PWStore.list) { clearInterval(poll); run().catch(e => report('run() 异常: ' + (e && e.message || e), false)); }
  else if (Date.now() - t0 > 8000) { clearInterval(poll); report('iframe 加载超时', false); }
}, 40);

const wait = ms => new Promise(r => setTimeout(r, ms));

async function run() {
  report('run() 已启动', null);
  const W = f.contentWindow, S = W.PWStore, D = W.document;
  if (!W || !S) { report('iframe 内 store 未加载', false); return; }
  if (!S.photos.available()) { report('浏览器环境不支持 IndexedDB', false); return; }
  const params = new URLSearchParams(location.search);
  const kase = params.get('case') || 'grid';

  const mk = (w, h, c1, c2) => new Promise(res => {
    const cv = D.createElement('canvas'); cv.width = w; cv.height = h;
    const g = cv.getContext('2d');
    const gr = g.createLinearGradient(0, 0, w, h);
    gr.addColorStop(0, c1); gr.addColorStop(1, c2);
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.fillStyle = 'rgba(255,255,255,.9)'; g.font = 'bold ' + Math.round(h * 0.07) + 'px sans-serif';
    g.fillText(w + '×' + h, 12, Math.round(h * 0.14));
    cv.toBlob(b => res(new W.File([b], 'test.jpg', { type: 'image/jpeg' })), 'image/jpeg', .9);
  });
  const DIMS = [
    [600, 800, '#A8C8D8', '#7C9EB0'], [600, 450, '#D8C8A8', '#B09B7C'],
    [500, 500, '#C8A8B8', '#A87C8C'], [600, 900, '#B8C8B0', '#8CA878'],
    [600, 350, '#C8B8D8', '#9A7CB0'], [500, 620, '#D8B8B0', '#B08A7C'],
    [600, 600, '#A8B0C8', '#7C88A8'], [500, 750, '#C0C8A0', '#98A870']
  ];
  const ensurePhotos = async (rec, count, dims) => {
    let r = S.get('travel', rec.id);
    if ((r.images || []).length < count) {
      const pids = (r.images || []).slice();
      while (pids.length < count) { pids.push(await S.photos.add('travel_' + rec.id, await mk(...dims[pids.length % dims.length]))); }
      const r2 = S.get('travel', rec.id); r2.images = pids; S.save('travel', Object.assign({}, r2), 'travel_gone');
    }
    return S.get('travel', rec.id);
  };
  const cellsLoaded = () => Array.from(D.querySelectorAll('.acell')).filter(c => !c.classList.contains('loading')).length;
  const thumbCount = () => Array.from(D.querySelectorAll('.acell img')).filter(i => i.src).length;
  const goAlbum = id => { W.location.hash = '#/album/' + id; };

  let rec = S.list('travel').find(x => x.destination === '测试 · 大理');
  if (!rec) rec = S.save('travel', { destination: '测试 · 大理', date: '10月2日–10月6日', note: '环海骑行 30km，日落绝佳' }, 'travel_gone').item;
  rec = await ensurePhotos(rec, 8, DIMS);
  const seedRec = S.list('travel').find(x => x.destination === '大理 · 洱海');

  if (kase === 'list') {
    W.location.hash = '#/m/travel';
    await wait(600);
    report('list | 去过=' + S.list('travel').filter(x => (x.ttype || 'gone') === 'gone').length + ' 处 | 基准照片=' + (rec.images || []).length + ' 张', true);
    return;
  }
  if (kase === 'empty') {
    goAlbum(seedRec.id);
    await wait(600);
    report('empty | 空状态页 | cells=' + D.querySelectorAll('.acell').length, D.querySelectorAll('.acell').length === 0 && !!D.getElementById('albfile'));
    return;
  }
  if (kase === 'grid' || kase === 'many') {
    if (kase === 'many') {
      let m = S.list('travel').find(x => x.destination === '压力测试 · 三十张');
      if (!m) m = S.save('travel', { destination: '压力测试 · 三十张', date: '11月' }, 'travel_gone').item;
      m = await ensurePhotos(m, 30, DIMS);
      rec = m;
    }
    goAlbum(rec.id);
    await wait(3000);
    const total = D.querySelectorAll('.acell').length;
    const loaded = cellsLoaded();
    if (kase === 'grid') {
      report('grid | 总数=' + total + ' | 已加载=' + loaded + ' | 缩略图=' + thumbCount(), total === 8 && loaded === 8);
      return;
    }
    // many：验证懒加载（首屏不加载全部）+ 滚动到底后继续加载
    const view = D.getElementById('view');
    view.scrollTop = view.scrollHeight; await wait(2500);
    const loaded2 = cellsLoaded();
    report('many | 总数=' + total + ' | 首屏加载=' + loaded + ' | 滚到底后=' + loaded2, total === 30 && loaded < total && loaded2 > loaded);
    return;
  }
  if (kase === 'edit') {
    goAlbum(rec.id); await wait(600);
    W.albumEnterEdit();                       // 进入编辑模式（window 上的函数）
    const pids = S.get('travel', rec.id).images;
    W.albumToggleSel(pids[0]); W.albumToggleSel(pids[2]); W.albumToggleSel(pids[5]);
    await wait(200);
    const bar = D.getElementById('abar');
    report('edit | 已选勾选圈=' + D.querySelectorAll('.asel.on').length + ' | 底栏「' + (D.getElementById('abcount') || {}).textContent + '」| 挂载手机壳=' + !!(bar && bar.parentElement.id === 'phone'),
      D.querySelectorAll('.asel.on').length === 3 && bar && bar.parentElement.id === 'phone' && (D.getElementById('abcount') || {}).textContent === '已选 3 张');
    return;
  }
  if (kase === 'delconfirm') {
    let d = S.list('travel').find(x => x.destination === '删除测试 · 泉城');
    if (!d) d = S.save('travel', { destination: '删除测试 · 泉城', date: '9月' }, 'travel_gone').item;
    d = await ensurePhotos(d, 4, DIMS);
    goAlbum(d.id); await wait(600);
    const before = S.get('travel', d.id).images.length;
    W.albumEnterEdit();
    const pids = S.get('travel', d.id).images;
    W.albumToggleSel(pids[0]); W.albumToggleSel(pids[1]);
    W.albumDeleteSel();                        // 弹出二次确认
    const sheetShown = !!D.querySelector('#sheet.show');
    D.getElementById('sok').onclick();        // 确认删除
    await wait(600);
    const afterRec = S.get('travel', d.id);
    const other = S.get('travel', rec.id);
    report('delconfirm | 二次确认弹层=' + sheetShown + ' | 照片 ' + before + '→' + (afterRec.images || []).length + ' | 退出编辑模式=' + !D.getElementById('abar') + ' | 其他地点照片=' + other.images.length,
      sheetShown && afterRec.images.length === 2 && !D.getElementById('abar') && other.images.length === 8);
    return;
  }
  if (kase === 'viewer') {
    goAlbum(rec.id); await wait(1200);
    W.openViewer(2); await wait(2500);
    const v = D.getElementById('viewer');
    const img = v && v.querySelectorAll('.v-page img')[2];
    report('viewer | 计数「' + (D.getElementById('vcount') || {}).textContent + '」| 原图已加载=' + !!(img && img.src) + ' | 页数=' + v.querySelectorAll('.v-page').length,
      !!(v && img && img.src && D.getElementById('vcount').textContent === '3 / 8'));
    return;
  }
  if (kase === 'zoom') {
    goAlbum(rec.id); await wait(1200);
    W.openViewer(1); await wait(2200);
    W.viewerZoomTo(196, 430);                 // 双击放大（window 函数）
    await wait(400);
    const img = D.querySelectorAll('.v-page img')[1];
    const tf = img && (img.style.transform || '');
    report('zoom | transform="' + tf + '" | 应含 scale(2.5)', /scale\(2\.5\)/.test(tf));
    return;
  }
  if (kase === 'swipe') {
    goAlbum(rec.id); await wait(1200);
    W.openViewer(1); await wait(2200);
    const strip = D.getElementById('vstrip');
    const fire = (type, pid, x, y) => strip.dispatchEvent(new W.PointerEvent(type, { pointerId: pid, clientX: x, clientY: y, bubbles: true, cancelable: true, isPrimary: pid === 1, pointerType: 'touch' }));
    const cnt0 = D.getElementById('vcount').textContent;
    fire('pointerdown', 1, 300, 420); fire('pointermove', 1, 150, 420); fire('pointerup', 1, 80, 420);   // 左滑 → 下一张
    await wait(400);
    const cnt1 = D.getElementById('vcount').textContent;
    fire('pointerdown', 1, 80, 420); fire('pointermove', 1, 240, 420); fire('pointerup', 1, 320, 420);  // 右滑 → 回上一张
    await wait(400);
    const cnt2 = D.getElementById('vcount').textContent;
    report('swipe | ' + cnt0 + ' → ' + cnt1 + ' → ' + cnt2, cnt0 === '2 / 8' && cnt1 === '3 / 8' && cnt2 === '2 / 8');
    return;
  }
  if (kase === 'pinch') {
    goAlbum(rec.id); await wait(1200);
    W.openViewer(1); await wait(2200);
    const strip = D.getElementById('vstrip');
    const fire = (type, pid, x, y) => strip.dispatchEvent(new W.PointerEvent(type, { pointerId: pid, clientX: x, clientY: y, bubbles: true, cancelable: true, isPrimary: pid === 1, pointerType: 'touch' }));
    fire('pointerdown', 1, 160, 420); fire('pointerdown', 2, 240, 420);   // 双指张开
    fire('pointermove', 1, 100, 420); fire('pointermove', 2, 300, 420);
    fire('pointerup', 1, 100, 420); fire('pointerup', 2, 300, 420);
    await wait(400);
    const img = D.querySelectorAll('.v-page img')[1];
    const tf1 = (img && img.style.transform) || '';
    fire('pointerdown', 1, 100, 420); fire('pointerdown', 2, 300, 420);   // 双指捏合
    fire('pointermove', 1, 150, 420); fire('pointermove', 2, 250, 420);
    fire('pointerup', 1, 150, 420); fire('pointerup', 2, 250, 420);
    await wait(400);
    const tf2 = (img && img.style.transform) || '';
    const s1 = parseFloat((tf1.match(/scale\(([\d.]+)\)/) || [])[1]);
    const s2 = parseFloat((tf2.match(/scale\(([\d.]+)\)/) || [])[1]);
    report('pinch | 张开 scale=' + s1 + ' | 捏合后 scale=' + s2, s1 > 1.8 && s2 < s1 && s2 > 1);
    return;
  }
  report('未知 case: ' + kase, false);
}
</script>
</body>
</html>
